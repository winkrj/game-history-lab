<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 900" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">게임 이력 조회용 데이터를 생성하고 변경을 반영하는 구조</title>
  <desc id="diagram-desc">MySQL 원본에서 Spring Batch가 조회용 데이터를 대량 생성하고 복구한다. Debezium과 Kafka는 이후 변경을 전달하며, CDC Consumer는 변경된 게임의 최신 원본을 다시 계산해 Read Model을 갱신한다. 조회 API는 Read Model만 읽는다.</desc>
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#433D38" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1689D8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#47783F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font: 700 40px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #2F2A26; }
      .subtitle { font: 400 20px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #736A63; }
      .eyebrow { font: 700 15px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; letter-spacing: 1.2px; }
      .node-title { font: 700 27px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #2F2A26; }
      .node-tech { font: 600 18px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #655C54; }
      .node-detail { font: 400 17px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #655C54; }
      .edge-label { font: 600 15px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #655C54; }
      .mini-title { font: 700 18px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #2F2A26; }
      .mini-text { font: 500 15px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #655C54; }
      .connector { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .card { fill: #FFFEFC; stroke: #655C54; stroke-width: 2.2; filter: url(#card-shadow); }
      .icon-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1680" height="900" fill="#FBFAF7"/>
  <path d="M68 148 C410 151 820 146 1612 149" fill="none" stroke="#DED9D3" stroke-width="2" stroke-linecap="round"/>
  <text class="title" x="68" y="76">조회용 데이터를 만들고, 변경을 따라잡는 흐름</text>
  <text class="subtitle" x="68" y="116">100만 건 초기 생성부터 이후 변경 반영까지</text>
  <g aria-label="로컬 실험 환경 표시">
    <rect x="1431" y="54" width="181" height="45" rx="22" fill="#F5EEE4" stroke="#B99D7B" stroke-width="1.8" stroke-dasharray="6 5"/>
    <circle cx="1460" cy="76.5" r="6" fill="#D97706"/>
    <text x="1480" y="82" class="eyebrow" fill="#7A5222">LOCAL LAB</text>
  </g>
  <g aria-label="데이터 흐름">
    <path class="connector" d="M310 390 C350 390 351 320 390 320" stroke="#1689D8" marker-end="url(#arrow-blue)"/>
    <path class="connector" d="M310 500 C350 500 351 615 390 615" stroke="#D97706" marker-end="url(#arrow-orange)"/>
    <path class="connector" d="M730 320 H1080 C1120 320 1142 350 1142 390 V414 C1142 429 1160 440 1200 440" stroke="#1689D8" marker-end="url(#arrow-blue)"/>
    <path class="connector" d="M730 615 H810" stroke="#D97706" marker-end="url(#arrow-orange)"/>
    <path class="connector" d="M1130 615 H1160 C1186 615 1193 594 1193 566 V510 C1193 497 1198 492 1200 492" stroke="#D97706" marker-end="url(#arrow-orange)"/>
    <path class="connector" d="M1480 445 H1520" stroke="#1689D8" marker-end="url(#arrow-blue)"/>
    <path class="connector" d="M970 725 V780 C970 806 946 817 920 817 H205 C178 817 160 798 160 770 V557" stroke="#47783F" stroke-dasharray="8 9" marker-end="url(#arrow-green)"/>
  </g>
  <g aria-label="MySQL 원본 데이터">
    <rect class="card" x="70" y="335" width="240" height="220" rx="24"/>
    <rect x="94" y="359" width="86" height="32" rx="16" fill="#EAF3E8"/><text class="eyebrow" x="115" y="381" fill="#47783F">SOURCE</text>
    <g transform="translate(242 358)" class="icon-line" stroke="#47783F"><ellipse cx="20" cy="8" rx="18" ry="7"/><path d="M2 8 V32 C2 39 38 39 38 32 V8 M2 20 C2 27 38 27 38 20"/></g>
    <text class="node-title" x="94" y="437">원본 데이터</text><text class="node-tech" x="94" y="471">MySQL 8.4</text>
    <text class="node-detail" x="94" y="509">games · rounds</text><text class="node-detail" x="94" y="535">round_scores</text>
  </g>
  <g aria-label="Spring Batch 대량 생성과 복구">
    <rect class="card" x="390" y="210" width="340" height="220" rx="24"/><path d="M415 212 C500 208 613 214 704 211" fill="none" stroke="#1689D8" stroke-width="5" stroke-linecap="round"/>
    <rect x="414" y="236" width="68" height="32" rx="16" fill="#E8F4FC"/><text class="eyebrow" x="433" y="258" fill="#1689D8">BULK</text>
    <g transform="translate(657 233)" class="icon-line" stroke="#1689D8"><path d="M4 8 H38 M4 20 H30 M4 32 H23"/><path d="M33 25 L42 32 L33 39"/></g>
    <text class="node-title" x="414" y="310">대량 생성 · 복구</text><text class="node-tech" x="414" y="344">Spring Batch</text>
    <text class="node-detail" x="414" y="382">최초 생성 · 전체 재생성 · 부분 복구</text><text class="node-detail" x="414" y="408">실패 지점부터 chunk 재시작</text>
  </g>
  <g aria-label="Debezium과 Kafka 변경 감지와 전달">
    <rect class="card" x="390" y="505" width="340" height="220" rx="24"/><path d="M415 507 C500 503 613 509 704 506" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
    <rect x="414" y="531" width="92" height="32" rx="16" fill="#FFF1DF"/><text class="eyebrow" x="431" y="553" fill="#B56200">CHANGE</text>
    <g transform="translate(655 529)" class="icon-line" stroke="#D97706"><path d="M3 12 H19 C27 12 27 28 35 28 H43"/><path d="M35 21 L43 28 L35 35"/><circle cx="3" cy="12" r="3" fill="#D97706" stroke="none"/></g>
    <text class="node-title" x="414" y="605">변경 감지 · 전달</text><text class="node-tech" x="414" y="639">Debezium + Kafka</text>
    <text class="node-detail" x="414" y="677">binlog 변경을 이벤트로 보관</text><text class="node-detail" x="414" y="703">Batch 실행 중 변경도 catch-up</text>
  </g>
  <g aria-label="CDC Consumer 변경 재계산">
    <rect class="card" x="810" y="505" width="320" height="220" rx="24"/><path d="M835 507 C920 503 1013 509 1104 506" fill="none" stroke="#47783F" stroke-width="5" stroke-linecap="round"/>
    <rect x="834" y="531" width="92" height="32" rx="16" fill="#EAF3E8"/><text class="eyebrow" x="853" y="553" fill="#47783F">APPLY</text>
    <g transform="translate(1056 529)" class="icon-line" stroke="#47783F"><path d="M11 5 C2 12 2 29 11 36 M31 5 C40 12 40 29 31 36"/><path d="M16 29 L26 12 M15 12 H15.2 M27 29 H27.2"/></g>
    <text class="node-title" x="834" y="605">변경 반영</text><text class="node-tech" x="834" y="639">CDC Consumer</text>
    <text class="node-detail" x="834" y="677">gameId만 꺼낸 뒤</text><text class="node-detail" x="834" y="703">최신 원본으로 전체 행 재계산</text>
  </g>
  <g aria-label="조회 전용 데이터">
    <rect class="card" x="1200" y="335" width="280" height="220" rx="24"/><rect x="1224" y="359" width="78" height="32" rx="16" fill="#F0ECE8"/><text class="eyebrow" x="1243" y="381" fill="#655C54">READ</text>
    <g transform="translate(1404 358)" class="icon-line" stroke="#655C54"><ellipse cx="20" cy="8" rx="18" ry="7"/><path d="M2 8 V32 C2 39 38 39 38 32 V8 M2 20 C2 27 38 27 38 20"/></g>
    <text class="node-title" x="1224" y="437">조회 전용 데이터</text><text class="node-tech" x="1224" y="471">Read Model</text>
    <text class="node-detail" x="1224" y="509">game당 1행</text><text class="node-detail" x="1224" y="535">조회 경로는 이 테이블만 사용</text>
  </g>
  <g aria-label="조회 API">
    <rect class="card" x="1520" y="390" width="120" height="110" rx="22"/><g transform="translate(1557 408)" class="icon-line" stroke="#1689D8"><path d="M10 1 L2 9 L10 17 M26 1 L34 9 L26 17 M21 0 L15 18"/></g>
    <text class="mini-title" x="1580" y="465" text-anchor="middle">History API</text><text class="mini-text" x="1580" y="488" text-anchor="middle">조회만</text>
  </g>
  <g aria-label="연결 설명">
    <rect x="331" y="337" width="91" height="27" rx="13" fill="#FBFAF7"/><text class="edge-label" x="376" y="356" text-anchor="middle">범위 읽기</text>
    <rect x="333" y="557" width="65" height="27" rx="13" fill="#FBFAF7"/><text class="edge-label" x="365" y="576" text-anchor="middle">binlog</text>
    <rect x="856" y="299" width="128" height="27" rx="13" fill="#FBFAF7"/><text class="edge-label" x="920" y="318" text-anchor="middle">범위 단위 UPSERT</text>
    <rect x="739" y="594" width="68" height="27" rx="13" fill="#FBFAF7"/><text class="edge-label" x="773" y="613" text-anchor="middle">이벤트</text>
    <rect x="1123" y="568" width="105" height="27" rx="13" fill="#FBFAF7"/><text class="edge-label" x="1175" y="587" text-anchor="middle">전체 행 UPSERT</text>
    <rect x="1488" y="424" width="46" height="27" rx="13" fill="#FBFAF7"/><text class="edge-label" x="1511" y="443" text-anchor="middle">조회</text>
    <rect x="486" y="797" width="148" height="30" rx="15" fill="#EEF5EC"/><text class="edge-label" x="560" y="817" text-anchor="middle" fill="#47783F">최신 원본 다시 조회</text>
  </g>
  <g aria-label="Batch와 CDC 전환 순서">
    <rect x="1198" y="686" width="422" height="106" rx="20" fill="#FFF9F1" stroke="#C9B59B" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text class="mini-title" x="1222" y="718">누락 없는 전환 순서</text><text class="mini-text" x="1222" y="756">① 변경 수집 시작</text>
    <path d="M1350 751 H1372" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-orange)"/><text class="mini-text" x="1390" y="756">② Batch 생성</text>
    <path d="M1492 751 H1514" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-orange)"/><text class="mini-text" x="1532" y="756">③ catch-up</text>
  </g>
  <text x="1612" y="858" text-anchor="end" class="mini-text" fill="#8A8179">repository-configured · local experiment</text>
</svg>
