spring:
  application:
    name: game-history-lab
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/game_history_lab?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:game_history}
    password: ${DB_PASSWORD:game_history}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:batch-schema.sql
  batch:
    job:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${CDC_CONSUMER_GROUP:game-history-read-model-cdc}
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

stage3:
  batch:
    chunk-size: 1000

stage4:
  incremental:
    chunk-size: 100

stage5:
  cdc:
    enabled: false
    fail-on-game-id: 0
