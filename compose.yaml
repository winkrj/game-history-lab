services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: game_history_lab
      MYSQL_USER: game_history
      MYSQL_PASSWORD: game_history
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql-data:
